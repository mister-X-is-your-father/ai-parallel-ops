# 256色対応
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# マウス操作を有効化
set -g mouse on

# -r(repeat)キーの連打受付時間。スマホのタッチ操作だと既定500msは短いので延長。
# prefix→Tab の後、この時間内なら Tab 連打だけでセッション巡回できる。
set -g repeat-time 800

# ペイン分割のキーバインド
bind | split-window -h
bind - split-window -v
unbind '"'

# ステータスバー2段
set -g status 2
# 画面上部に配置 — 左上の status-left [#S] を「タップ1回でrename」できる大きな
# ターゲットにするため(上部ペインボーダーの[#S]は1行で細くタッチだと当たらない)。
set -g status-position top
set -g status-bg colour235
set -g status-fg white
# 左側: [セッション名] ディレクトリ名 (git ブランチ) — アクティブペイン基準。
set -g status-left '[#S] #(~/claudeutil/dotfiles/pane-info.sh "#{pane_current_path}") '
set -g status-left-length 50
# 右側: 時計のみ(srv インジケータは2段目へ移動)。
set -g status-right '%Y-%m-%d %H:%M'
set -g status-right-length 22

# 2段目: 起動中サーバー数 [srv:N]。この行(や status バー中央/右)をタップで
# 起動中サーバー一覧を display-menu で即時表示(項目を選ぶと URL をクリップボードへ)。
set -g status-format[1] '#[align=left,bg=colour236,fg=colour248] #(~/claudeutil/dotfiles/srv-status.sh --indicator) '

# ペインの背景色・文字色
set -g window-active-style 'bg=#000000,fg=#00ff00'
set -g window-style 'bg=#1a1a1a,fg=#aaaaaa'

# ペインボーダー色
set -g pane-active-border-style 'fg=#00ff00'
set -g pane-border-style 'fg=#666666'

# ヒストリーサイズ
set -g history-limit 500

# 下スクロールで一番下に達したら即座にコピーモード終了
bind -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" ""

# ペイン境界の上部ラベル行は廃止 — 情報(セッション名/ディレクトリ/ブランチ)は上部
# ステータスバーに集約した。分割時の境界線そのものは描画される。
set -g pane-border-status off

# WSLクリップボード連携
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
set -g alternate-screen off

# === Session を Tab で巡回 ===
# prefix の後に Tab を連打でセッションを順に巡回(-r=repeat、500ms以内なら prefix 不要で連打可)。
# 素の Tab は root で奪うとシェル補完が壊れるため prefix 配下にする(スマホでも Ctrl→b→Tab…)。
# 末尾で循環(-n は最後→最初へラップ)するので Tab 連打だけで全周できる。
bind -r Tab  switch-client -n
bind -r BTab switch-client -p

# === Session 名のリネーム ===
# [セッション名] を変えたい時の入口を複数用意。現在名を初期値にして編集。
# タッチ操作だとダブルタップが押しにくいので「シングルクリック/タップ」で開く。
#  - F2                       : どこからでも一発
#  - 上部ペインボーダーをタップ      : [#S] が出てる行を1回。狙いを外すと下のペインに当たる
#  - 下部ステータスバー左の [#S] をタップ : 大きく確実なターゲット
#  - prefix+$                 : 従来どおり
# (注: 境界ドラッグでのペインリサイズは MouseDown が先に発火して prompt が開くので、
#  リサイズしたい時は prefix の resize-pane を使う)
bind -n F2 command-prompt -I "#S" "rename-session -- '%%'"
bind -n MouseDown1Border command-prompt -I "#S" "rename-session -- '%%'"
bind -n MouseDown1StatusLeft command-prompt -I "#S" "rename-session -- '%%'"

# === srv 一覧メニュー ===
# 2段目の [srv:N] タップ(=StatusDefault領域)で起動中サーバー一覧を display-menu 即時表示。
# tmux 3.2a は specific 領域(StatusDefault/Right)が未バインドでも汎用 MouseDown1Status へ
# フォールバックしないので、領域ごとに明示バインドする。StatusLeft は [#S] rename 専用。
bind -n MouseDown1StatusDefault run-shell "~/claudeutil/dotfiles/srv-status.sh --menu"
bind -n MouseDown1StatusRight   run-shell "~/claudeutil/dotfiles/srv-status.sh --menu"

# === Session 永続化 (resurrect + continuum) ===
# 目的: WSL再起動でも tmux session/window/pane/cwd を完全復元
# - resurrect: 手動保存/復元 (prefix+Ctrl-s 保存, prefix+Ctrl-r 復元)
# - continuum: 15分毎に自動保存 + tmux server 起動時に自動復元
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# pane の中身(直近の画面テキスト)も保存
set -g @resurrect-capture-pane-contents 'on'
# 2026-06-12: 再起動復元時に Claude を自動再開する。
# "~claude" = 保存時に claude が動いていた pane → 復元時に claude -c (直近会話を継続、ピッカー不要) を実行。
# これが無いと「静止画の Claude + 下に bash プロンプト」という幽霊状態になり、即終了したように見える。
# 先頭の vi〜htop は resurrect デフォルト復元リストの維持(この設定はデフォルトを置き換えるため明記)。
set -g @resurrect-processes 'vi vim nvim emacs man less more tail top htop "~claude->claude -c --dangerously-skip-permissions"'
# 起動時に自動復元
set -g @continuum-restore 'on'
# 自動保存間隔(分)
set -g @continuum-save-interval '15'
# 保存先: ~/.tmux/resurrect/
set -g @resurrect-dir '~/.tmux/resurrect'

# tpm 起動 — 必ず一番下に置くこと
run '~/.tmux/plugins/tpm/tpm'
