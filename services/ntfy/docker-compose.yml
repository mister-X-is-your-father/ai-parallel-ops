services:
  ntfy:
    image: binwiederhier/ntfy:v2.22.0
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "false"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_AUTH_DEFAULT_ACCESS: read-write
      NTFY_ENABLE_LOGIN: "false"
      NTFY_WEB_PUSH_PUBLIC_KEY: ""
    volumes:
      - ./cache:/var/cache/ntfy
      - ./attachments:/var/lib/ntfy/attachments
      - ./config:/etc/ntfy
    ports:
      - "${NTFY_HOST_PORT:-8765}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
